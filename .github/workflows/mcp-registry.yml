name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Update server.json version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          gh release download --repo modelcontextprotocol/registry --pattern 'mcp-publisher_linux_amd64.tar.gz'
          tar -xzf mcp-publisher_linux_amd64.tar.gz
          chmod +x mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Authenticate with OIDC
        run: ./mcp-publisher auth github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
