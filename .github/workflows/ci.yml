name: CI

# First PR-blocking workflow for the repo: runs the test suite on every push and
# pull request so regressions are caught before merge. The JVM/Ghidra end-to-end
# tests live in security-e2e.yml (gated by PYGHIDRA_E2E); the default suite here
# is JVM-free and auto-skips those.
on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev
      # Informational for now: the repo carries pre-existing lint debt that predates
      # this workflow. Surfacing it here without blocking lets it be cleaned up in a
      # dedicated pass; flip continue-on-error off once `ruff check` is green.
      - name: Run ruff
        continue-on-error: true
        run: uv run ruff check .
